[package]
name = "niri-tablet-bar"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
freedesktop-desktop-entry = "0.8.1"
gtk4 = "0.11.3"
gtk4-layer-shell = "0.8.0"
libadwaita = { version = "0.9.1", features = ["v1_6"] }
niri-ipc = "26.4.0"
serde = "1.0.228"
toml = { version = "1.1.2", features = ["serde"] }
zbus = "5.16.0"

[build-dependencies]
glib-build-tools = "0.22.0"
