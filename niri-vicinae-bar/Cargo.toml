[package]
name = "niri-vicinae-bar"
version = "0.1.0"
edition = "2024"

[dependencies]
calloop = "0.14.5"
chrono = "0.4.45"
clap = { version = "4.6.1", features = ["derive"] }
dirs = "6.0.0"
env_logger = "0.11.11"
gtk4 = "0.11.3"
gtk4-layer-shell = "0.8.0"
json = "0.12.4"
libadwaita = { version = "0.9.1", features = ["v1_6"] }
log = "0.4.35"
niri-ipc = "26.4.0"
serde = "1.0.228"
toml = { version = "1.1.2", features = ["serde"] }

[build-dependencies]
glib-build-tools = "0.22.0"
