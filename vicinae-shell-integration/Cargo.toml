[package]
name = "vicinae-shell-integration"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
fast_image_resize = { version = "6.1.0", features = ["image", "std", "rayon"] }
image = { version = "0.25.10", features = ["default-formats"] }
log = "0.4.35"
smithay-client-toolkit = "0.21.1"
softbuffer = "0.4.8"

[features]
bench = [] # enables benchmarking image draw speeds
